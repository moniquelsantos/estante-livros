  });

  async function buscarLivros() {
    const termo = $("campoBusca").value.trim();
    if (termo === "") return;

    $("resultados").innerHTML = `<p class="msg">Buscando...</p>`;

    const prefixo = $("tipoBusca").value;
    const consulta = prefixo ? prefixo + '"' + termo + '"' : termo;

    try {
      const url = "https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(consulta)
                + "&maxResults=12&printType=books"
                + ($("soPortugues").checked ? "&langRestrict=pt" : "")
                + "&key=" + CHAVE_API;
      const resposta = await fetch(url);
      const dados = await resposta.json();

      if (!resposta.ok) {
        $("resultados").innerHTML = `<p class="msg">Erro da API: ${limpar(dados.error?.message || String(resposta.status))}</p>`;
        return;
      }

      ultimosResultados = dados.items || [];
      mostrarResultados();
    } catch (erro) {
      $("resultados").innerHTML = `<p class="msg">Ops, algo deu errado. Tente de novo.</p>`;
    }
  }

  function mostrarResultados() {
    if (ultimosResultados.length === 0) {
      $("resultados").innerHTML = `<p class="msg">Nenhum livro encontrado.</p>`;
      return;
    }

    $("resultados").innerHTML = ultimosResultados.map((livro, i) => {
      const l = dadosDoLivro(livro);
      return `
        <div class="card">
          ${l.capa ? `<img src="${l.capa}" alt="">` : `<div class="sem-capa">Sem capa</div>`}
          <h3>${limpar(l.titulo)}</h3>
          <p>${limpar(l.autor)}</p>
          <button onclick="adicionarLivro(${i}, 'quero')">${ICONES.quero} ${NOMES.quero}</button>
          <button onclick="adicionarLivro(${i}, 'lendo')">${ICONES.lendo} ${NOMES.lendo}</button>
          <button onclick="adicionarLivro(${i}, 'lido')">${ICONES.lido} ${NOMES.lido}</button>
        </div>`;
    }).join("");
  }

  function adicionarLivro(indice, status) {
    const l = dadosDoLivro(ultimosResultados[indice]);
    let livro = minhaLista.find(item => item.id === l.id);

    if (!livro) {
      livro = l;
      livro.estilo = "capa";
      minhaLista.push(livro);
    }

    definirStatus(livro, status);
    salvarLista();
    desenharTudo();
    extrairCor(livro);
    avisar('Adicionado em "' + NOMES[status] + '"');
  }

  $("botaoBuscar").addEventListener("click", buscarLivros);
  $("campoBusca").addEventListener("keydown", (e) => { if (e.key === "Enter") buscarLivros(); });

  // ====== AVISO RAPIDINHO ======
  function avisar(texto) {
    $("aviso").textContent = texto;
    $("aviso").classList.add("visivel");
    setTimeout(() => $("aviso").classList.remove("visivel"), 1800);
  }

  // ====== DESENHAR: INÍCIO ======
  function capaOuTitulo(l) {
    return l.capa
      ? `<img src="${l.capa}" alt="" onclick="abrirDetalhes('${l.id}')">`
      : `<div class="sem-capa-mini" onclick="abrirDetalhes('${l.id}')">${limpar(l.titulo)}</div>`;
  }

  function desenharInicio() {
    const nome = localStorage.getItem("nomeLeitor");
    let html = nome ? `<p class="saudacao">Olá, ${limpar(nome)} 👋</p>` : "";

    ["lendo", "quero", "lido"].forEach(status => {
      const livros = minhaLista.filter(l => l.status === status);

      // A setinha só aparece quando tem mais livros do que cabem no Início
      const seta = livros.length > MAX_NO_INICIO
        ? `<button class="seta" onclick="abrirCategoria('${status}')" aria-label="Ver todos os livros de ${NOMES[status]}">
             <svg class="icone" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
           </button>`
        : "";

      html += `<div class="secao-topo">
                 <h2>${ICONES[status]} ${NOMES[status]} <small>(${livros.length})</small></h2>
                 ${seta}
               </div>`;

      if (livros.length === 0) {
        html += `<p class="vazio">Nada por aqui ainda. Toque na lupa lá em cima para buscar um livro.</p>`;
      } else {
        html += `<div class="grade-capas">${livros.slice(0, MAX_NO_INICIO).map(capaOuTitulo).join("")}</div>`;
      }
    });

    $("aba-inicio").innerHTML = html;
  }

  // ====== DESENHAR: PÁGINA DE LISTA (todos os livros de uma categoria) ======
  function estrelasTexto(n) {
    return "★".repeat(n) + "☆".repeat(5 - n);
  }

  function itemDaLista(l) {
    const capa = l.capa
      ? `<img src="${l.capa}" alt="">`
      : `<div class="sem-capa-mini">${limpar(l.titulo)}</div>`;
    const data = (l.status === "lido" && l.dataLido)
      ? `<p class="data">Lido em ${formatarData(l.dataLido)}</p>` : "";
    const nota = (l.status === "lido" && l.nota)
      ? `<p class="estrelas-mini">${estrelasTexto(l.nota)}</p>` : "";

    return `
      <div class="item-lista" onclick="abrirDetalhes('${l.id}')">
        <div class="capa-lista">${capa}</div>
        <div>
          <h3>${limpar(l.titulo)}</h3>
          <p>${limpar(l.autor)}</p>
          ${data}${nota}
        </div>
      </div>`;
  }

  function desenharLista() {
    if (!categoriaAberta) { $("aba-lista").innerHTML = ""; return; }

    const livros = minhaLista.filter(l => l.status === categoriaAberta);
    if (categoriaAberta === "lido") {
      livros.sort((a, b) => b.dataLido.localeCompare(a.dataLido));   // últimos lidos primeiro
    }

    const qtd = livros.length + (livros.length === 1 ? " livro" : " livros");
    $("aba-lista").innerHTML = livros.length === 0
      ? `<p class="qtd-lista">Nada por aqui ainda.</p>`
      : `<p class="qtd-lista">${qtd}</p>` + livros.map(itemDaLista).join("");
  }

  // ====== DESENHAR: PÁGINA DO LIVRO ======
  const ESTRELA = `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;

  function desenharLivro() {
    const l = minhaLista.find(x => x.id === livroAberto);
    if (!l) { $("aba-livro").innerHTML = ""; return; }

    const botoesStatus = ["quero", "lendo", "lido"].map(s =>
      `<button class="${l.status === s ? "ativo" : ""}" onclick="mudarStatus('${l.id}', '${s}')">${ICONES[s]} ${NOMES[s]}</button>`
    ).join("");

    // Nota, data e estilo na estante: só para livros já lidos
    let blocoLido = "";
    if (l.status === "lido") {
      const estrelas = [1, 2, 3, 4, 5].map(n =>
        `<button class="${n <= (l.nota || 0) ? "cheia" : ""}" onclick="mudarNota('${l.id}', ${n})" aria-label="${n} estrelas">${ESTRELA}</button>`
      ).join("");
      const botoesEstilo = ["capa", "lombada", "deitado"].map(e =>
        `<button class="${(l.estilo || "capa") === e ? "ativo" : ""}" onclick="mudarEstilo('${l.id}', '${e}')">${e[0].toUpperCase() + e.slice(1)}</button>`
      ).join("");
      blocoLido = `
        <p class="rotulo">Minha nota</p>
        <div class="estrelas">${estrelas}</div>
        <p class="rotulo">Terminei de ler em</p>
        <input type="date" value="${l.dataLido}" onchange="mudarData('${l.id}', this.value)">
        <p class="rotulo">Como aparece na estante</p>
        <div class="grupo">${botoesEstilo}</div>`;
    }

    const capa = l.capa ? `<img src="${l.capa}" alt="">` : `<div class="sem-capa-mini">${limpar(l.titulo)}</div>`;
    $("aba-livro").innerHTML = `
      <div class="livro-pagina">
        <div class="livro-cabeca">
          <div class="capa-grande">${capa}</div>
          <div><h2>${limpar(l.titulo)}</h2><p>${limpar(l.autor)}</p></div>
        </div>
        <p class="rotulo">Onde ele está</p>
        <div class="grupo">${botoesStatus}</div>
        ${blocoLido}
        <p class="rotulo">Minhas anotações</p>
        <textarea class="anotacao" id="campoAnotacao" placeholder="O que você está pensando sobre esse livro?"
                  oninput="salvarAnotacao('${l.id}', this.value)">${limpar(l.anotacao || "")}</textarea>
        <p class="salvo" id="msgSalvo"></p>
        <button class="perigo" onclick="removerLivro('${l.id}')">Remover da minha lista</button>
      </div>`;
  }

  let temporizadorSalvo;
  function salvarAnotacao(id, texto) {
    const l = minhaLista.find(x => x.id === id);
    if (!l) return;
    l.anotacao = texto;
    salvarLista();
    const msg = $("msgSalvo");
    if (msg) {
      msg.textContent = "Salvo automaticamente ✓";
      clearTimeout(temporizadorSalvo);
      temporizadorSalvo = setTimeout(() => { msg.textContent = ""; }, 1500);
    }
  }

  function mudarNota(id, n) {
    const l = minhaLista.find(x => x.id === id);
    l.nota = (l.nota === n) ? 0 : n;       // tocar na mesma estrela de novo tira a nota
    salvarLista();
    desenharTudo();
  }

  function mudarStatus(id, status) {
    definirStatus(minhaLista.find(x => x.id === id), status);
    salvarLista();
    desenharTudo();
  }

  function mudarEstilo(id, estilo) {
    minhaLista.find(x => x.id === id).estilo = estilo;
    salvarLista();
    desenharTudo();
  }

  function mudarData(id, valor) {
    if (!valor) return;
    minhaLista.find(x => x.id === id).dataLido = valor;
    salvarLista();
    desenharEstante();
    desenharLista();
    desenharResumo();
  }

  function removerLivro(id) {
    minhaLista = minhaLista.filter(x => x.id !== id);
    salvarLista();
    desenharTudo();
    voltar();
  }

  // ====== DESENHAR: ESTANTE ======
  function corDaLombada(titulo) {
    let soma = 0;
    for (const letra of titulo) soma += letra.charCodeAt(0);
    return "hsl(" + (soma * 37 % 360) + ", 45%, 35%)";
  }

  // --- Medir o texto: o título inteiro precisa caber na lombada ---
  const medidor = document.createElement("canvas").getContext("2d");
  function larguraTexto(txt, px) {
    medidor.font = "bold " + px + "px Georgia, 'Times New Roman', serif";
    return medidor.measureText(txt).width * 1.04 + txt.length * 0.25 + 1;
  }

  // Divide o título em linhas que cabem em "maximo" pixels. Devolve null se uma palavra sozinha não couber.
  function quebrarTitulo(titulo, px, maximo) {
    const palavras = titulo.split(/\s+/).filter(Boolean);
    const linhas = [];
    let atual = "";
    for (const p of palavras) {
      const tentativa = atual ? atual + " " + p : p;
      if (larguraTexto(tentativa, px) <= maximo) { atual = tentativa; continue; }
      if (atual) linhas.push(atual);
      if (larguraTexto(p, px) > maximo) return null;
      atual = p;
    }
    if (atual) linhas.push(atual);
    return linhas;
  }

  // Um número "aleatório" que é sempre o mesmo para o mesmo livro (para cada um ter alturas diferentes)
  function hashDe(txt) {
    let h = 0;
    for (const c of txt) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return h;
  }

  const cacheMedidas = {};
  function medidasLombada(titulo, id) {
    const chave = "v" + id + "|" + titulo;
    if (cacheMedidas[chave]) return cacheMedidas[chave];
    const h = hashDe(id + titulo);
    const altura = 108 + (h % 9);                 // cada lombada tem uma altura (108 a 116)
    const maximo = altura - 32;                   // espaço para o texto, entre os filetes
    const tentativas = [[12, 2], [11, 2], [10, 2], [9.5, 3], [9, 3], [8.5, 4], [8, 4], [7.5, 5]];
    let escolha = null;
    for (const [px, maxLinhas] of tentativas) {
      const linhas = quebrarTitulo(titulo, px, maximo);
      if (linhas && linhas.length <= maxLinhas) { escolha = { px, linhas }; break; }
    }
    if (!escolha) escolha = { px: 7.5, linhas: [titulo] };   // palavra gigante: último recurso
    const largura = Math.round(escolha.linhas.length * escolha.px * 1.3 + 18 + (h >> 3) % 5);
    return (cacheMedidas[chave] = { px: escolha.px, linhas: escolha.linhas, largura, altura });
  }

  function medidasDeitado(titulo, id) {
    const chave = "d" + id + "|" + titulo;
    if (cacheMedidas[chave]) return cacheMedidas[chave];
    const h = hashDe(id + titulo);
    const maximo = 104;                           // título comprido quebra em linhas em vez de esticar o livro
    let escolha = null;
    for (const [px, maxLinhas] of [[12, 2], [11, 2], [10, 3], [9, 3], [9, 4], [8, 5]]) {
      const linhas = quebrarTitulo(titulo, px, maximo);
      if (linhas && linhas.length <= maxLinhas) { escolha = { px, linhas }; break; }
    }
    if (!escolha) escolha = { px: 8, linhas: [titulo] };
    const maisLonga = Math.max(...escolha.linhas.map(l => larguraTexto(l, escolha.px)));
    const largura = Math.min(150, Math.max(88, Math.round(maisLonga + 30)));
    const altura = Math.round(escolha.linhas.length * escolha.px * 1.3 + 12 + (h % 4));
    return (cacheMedidas[chave] = { px: escolha.px, linhas: escolha.linhas, largura, altura });
  }

  // Monta a lombada ou o livro deitado, com a cor da capa
  function pecaColorida(classe, livro) {
    const m = classe === "lombada" ? medidasLombada(livro.titulo, livro.id) : medidasDeitado(livro.titulo, livro.id);
    const texto = `<span class="texto-lombada" style="font-size:${m.px}px">${m.linhas.map(limpar).join("<br>")}</span>`;
    const tamanho = `width:${m.largura}px;height:${m.altura}px;`;
    const filetes = classe === "lombada"
      ? `<i class="filete" style="top:6px"></i><i class="filete" style="bottom:6px"></i>`
      : `<i class="filete" style="left:7px"></i><i class="filete" style="right:7px"></i>`;

    if (livro.corCapa) {
      return `<div class="${classe}" style="${tamanho}background-color:${livro.corCapa}">${filetes}${texto}</div>`;
    }
    if (livro.capa) {   // plano B: a própria capa desfocada (também fica na cor da capa)
      return `<div class="${classe} com-capa" style="${tamanho}background-color:#444">
                <span class="fundo-capa" style="background-image:url('${livro.capa}')"></span>${filetes}${texto}
              </div>`;
    }
    return `<div class="${classe}" style="${tamanho}background-color:${corDaLombada(livro.titulo)}">${filetes}${texto}</div>`;
  }

  function pecaDoLivro(livro) {
    let estilo = livro.estilo || "capa";
    if (!livro.capa && estilo === "capa") estilo = "lombada"; // sem capa, vira lombada

    let aparencia;
    if (estilo === "lombada") aparencia = pecaColorida("lombada", livro);
    else if (estilo === "deitado") aparencia = pecaColorida("deitado", livro);
    else aparencia = `<img class="capa-estante" src="${livro.capa}" alt="" draggable="false">`;

    return `<div class="livro-estante" data-chave="l:${livro.id}" onclick="tocarPeca('l:${livro.id}')">${aparencia}</div>`;
  }

  // --- Enfeites ---
  let contadorSvg = 0;
  function svgDeco(tipo, escala) {
    const d = DECORACOES[tipo];
    const e = escala || 1;
    const prefixo = "u" + (++contadorSvg) + "_";
    return `<svg viewBox="0 0 ${d.w} ${d.h}" width="${Math.round(d.w * e)}" height="${Math.round(d.h * e)}" aria-hidden="true">${d.svg.replace(/__/g, prefixo)}</svg>`;
  }

  function imagemDaDeco(id) {
    if (!(id in cacheImagensDeco)) {
      try { cacheImagensDeco[id] = localStorage.getItem("decoImg_" + id) || ""; } catch (e) { cacheImagensDeco[id] = ""; }
    }
    return cacheImagensDeco[id];
  }

  function conteudoDaDeco(d) {
    if (d.tipo === "imagem") {
      const e = d.escala || 1;
      const s = Math.min(88 / d.h, 130 / d.w);
      return `<img class="deco-img" src="${imagemDaDeco(d.id)}" width="${Math.round(d.w * s * e)}" height="${Math.round(d.h * s * e)}" alt="" draggable="false">`;
    }
    return svgDeco(d.tipo, d.escala);
  }

  function pecaDaDeco(d) {
    return `<div class="livro-estante" data-chave="d:${d.id}" onclick="tocarPeca('d:${d.id}')">${conteudoDaDeco(d)}</div>`;
  }

  // --- A ordem das peças na estante ---
  // Sem ordem salva: enfeites do começo, livros por data, enfeites do fim.
  // Com ordem salva (depois de arrastar): ela manda, e o que for novo entra no fim.
  function ordemCompleta() {
    const lidos = minhaLista.filter(l => l.status === "lido").sort((a, b) => a.dataLido.localeCompare(b.dataLido));
    const padrao = [
      ...decoracoes.filter(d => d.lado === "inicio").map(d => "d:" + d.id),
      ...lidos.map(l => "l:" + l.id),
      ...decoracoes.filter(d => d.lado !== "inicio").map(d => "d:" + d.id)
    ];
    const existe = new Set(padrao);
    const salvas = ordemSalva.filter(k => existe.has(k));
    const vistas = new Set(salvas);
    return salvas.concat(padrao.filter(k => !vistas.has(k)));
  }

  function chavesVisiveis(ano, mes) {
    const livrosVisiveis = new Set(minhaLista
      .filter(l => l.status === "lido")
      .filter(l => !ano || l.dataLido.slice(0, 4) === ano)
      .filter(l => !mes || l.dataLido.slice(5, 7) === mes)
      .map(l => "l:" + l.id));
    return ordemCompleta().filter(k => k[0] === "d" || livrosVisiveis.has(k));
  }

  function pecaPorChave(k) {
    if (k[0] === "l") {
      const l = minhaLista.find(x => x.id === k.slice(2));
      return l ? pecaDoLivro(l) : "";
    }
    const d = decoracoes.find(x => x.id === k.slice(2));
    return d ? pecaDaDeco(d) : "";
  }

  // --- A arrumação: em que estante e em que prateleira fica cada peça ---
  // Sem arrumação salva: as peças entram em fila (ordem por data). Depois que você arrasta, vale a sua.
  function larguraDaPeca(k) {
    if (k[0] === "l") {
      const l = minhaLista.find(x => x.id === k.slice(2));
      if (!l) return 0;
      let estilo = l.estilo || "capa";
      if (!l.capa && estilo === "capa") estilo = "lombada";
      if (estilo === "lombada") return medidasLombada(l.titulo, l.id).largura;
      if (estilo === "deitado") return medidasDeitado(l.titulo, l.id).largura;
      return 72;
    }
    const d = decoracoes.find(x => x.id === k.slice(2));
    if (!d) return 0;
    const e = d.escala || 1;
    if (d.tipo === "imagem") return Math.round(d.w * Math.min(88 / d.h, 130 / d.w) * e);
    return Math.round(DECORACOES[d.tipo].w * e);
  }

  function larguraDaFileira() {
    const total = $("estantes").clientWidth || (Math.min(480, window.innerWidth) - 16);
    return total - 16 - (estruturaEscolhida === "inteira" ? 20 : 0) - 12;
  }

  const novaEstante = () => Array.from({ length: FILEIRAS }, () => []);
  const ocupado = (fileira) => fileira.reduce((soma, k) => soma + larguraDaPeca(k) + 4, 0);

  function montarArrumacao() {
    const todas = ordemCompleta();
    const existe = new Set(todas);
    const limite = larguraDaFileira() + 4;
    const vistos = new Set();
    const est = (arrumacao || []).map(e => Array.from({ length: FILEIRAS }, (_, i) =>
      (e[i] || []).filter(k => existe.has(k) && !vistos.has(k) && vistos.add(k))));
    if (!est.length) est.push(novaEstante());

    // se uma prateleira ficou cheia demais (tela menor, livro mudou de estilo...), o excesso desce
    for (let ei = 0; ei < est.length; ei++) {
      for (let fi = 0; fi < FILEIRAS; fi++) {
        const f = est[ei][fi];
        while (f.length > 1 && ocupado(f) > limite) {
          const k = f.pop();
          let ne = ei, nf = fi + 1;
          if (nf >= FILEIRAS) { ne++; nf = 0; }
          if (!est[ne]) est.push(novaEstante());
          est[ne][nf].unshift(k);
        }
      }
    }

    // peças novas: na primeira prateleira com espaço
    let ce = 0, cf = 0;
    for (const k of todas) {
      if (vistos.has(k)) continue;
      const w = larguraDaPeca(k) + 4;
      if (arrumacao) { ce = 0; cf = 0; }
      for (;;) {
        if (!est[ce]) est.push(novaEstante());
        const f = est[ce][cf];
        if (!f.length || ocupado(f) + w <= limite) { f.push(k); break; }
        cf++;
        if (cf >= FILEIRAS) { cf = 0; ce++; }
      }
    }
    while (est.length > 1 && est[est.length - 1].every(f => !f.length)) est.pop();
    return est;
  }

  function htmlMovel(estante) {
    const luz = luzesEscolhidas !== "nenhuma";
    const classes = "movel " + (estruturaEscolhida === "inteira" ? "inteira" : "flutuante") + (luz ? " com-luz" : "");
    const fileiras = estante.map(f =>
      `<div class="fileira">${luz ? `<div class="luz"></div>` : ""}${f.map(pecaPorChave).join("")}</div><div class="tabua"></div>`).join("");
    return `<div class="vaga"><div class="${classes}"><div class="coroa"></div><div class="corpo">${fileiras}</div><div class="rodape"></div></div></div>`;
  }

  let redesenharDepois = false;
  function desenharEstante() {
    if (arrasto && arrasto.iniciou) { redesenharDepois = true; return; }   // não mexe nas peças enquanto você arrasta
    const lidos = minhaLista.filter(l => l.status === "lido");

    // Filtro de ano: lista só os anos que existem nos seus livros
    const anos = [...new Set(lidos.map(l => l.dataLido.slice(0, 4)))].sort().reverse();
    const anoAntes = $("filtroAno").value;
    $("filtroAno").innerHTML = `<option value="">Todos os anos</option>`
      + anos.map(a => `<option value="${a}">${a}</option>`).join("");
    $("filtroAno").value = anos.includes(anoAntes) ? anoAntes : "";

    const ano = $("filtroAno").value;
    const mes = $("filtroMes").value;
    const filtrando = !!(ano || mes);
    if (filtrando) modoOrganizar = false;                 // só dá para organizar vendo todos os livros

    const visiveis = new Set(chavesVisiveis(ano, mes));
    const qtdLivros = [...visiveis].filter(k => k[0] === "l").length;
    $("contagem").textContent = qtdLivros + (qtdLivros === 1 ? " livro" : " livros");

    let est = montarArrumacao().map(e => e.map(f => f.filter(k => visiveis.has(k))));
    if (filtrando) {
      est = est.filter(e => e.some(f => f.length));
      if (!est.length) est = [novaEstante()];
    }
    if (modoOrganizar) est.push(novaEstante());           // uma estante vazia a mais, para você ter para onde levar

    $("estantes").innerHTML = est.map(htmlMovel).join("");
    atualizarOrganizar();
    atualizarPontos();
  }

  // Bolinhas embaixo: mostram em qual estante você está
  function atualizarPontos() {
    const t = $("estantes"), n = t.children.length;
    const atual = Math.round(t.scrollLeft / Math.max(1, t.clientWidth));
    $("pontos").innerHTML = n < 2 ? "" : Array.from({ length: n }, (_, i) =>
      `<button class="${i === atual ? "ativo" : ""}" onclick="irParaEstante(${i})" aria-label="Estante ${i + 1}"></button>`).join("");
  }
  function irParaEstante(i) {
    const t = $("estantes");
    t.scrollTo({ left: i * t.clientWidth, behavior: "smooth" });
  }
  let pontosNaFila = false;
  $("estantes").addEventListener("scroll", () => {
    if (pontosNaFila) return;
    pontosNaFila = true;
    requestAnimationFrame(() => { pontosNaFila = false; atualizarPontos(); });
  });
  let esperaTamanho;
  window.addEventListener("resize", () => { clearTimeout(esperaTamanho); esperaTamanho = setTimeout(desenharEstante, 200); });

  // ====== ESTANTE: ORGANIZAR (ARRASTAR) ======
  let arrasto = null;
  let ultimoArrasto = 0;
  let rolagemAuto = 0;

  function atualizarOrganizar() {
    $("estantes").classList.toggle("organizando", modoOrganizar);
    $("faixaOrganizar").hidden = !modoOrganizar;
    $("textoOrganizar").textContent = modoOrganizar ? "Pronto" : "Organizar";
    $("botaoOrganizar").classList.toggle("ativo-org", modoOrganizar);
    $("botaoMais").hidden = modoOrganizar;
  }

  function alternarOrganizar() {
    if (!modoOrganizar && ($("filtroAno").value || $("filtroMes").value)) {
      avisar("Tire o filtro de ano e mês para organizar");
      return;
    }
    modoOrganizar = !modoOrganizar;
    desenharEstante();
    if (modoOrganizar) avisar("Segure e arraste");
  }

  let quandoPediuData = 0;
  function ordenarPorData() {
    if (Date.now() - quandoPediuData > 3000) {          // primeiro toque só pergunta
      quandoPediuData = Date.now();
      $("botaoPorData").textContent = "Toque de novo para confirmar";
      setTimeout(() => { $("botaoPorData").textContent = "Arrumar por data"; }, 3000);
      return;
    }
    quandoPediuData = 0;
    arrumacao = null;
    ordemSalva = [];
    try { localStorage.removeItem("arrumacaoEstante"); } catch (e) {}
    guardar("ordemEstante", "[]");
    $("botaoPorData").textContent = "Arrumar por data";
    desenharEstante();
    avisar("Livros em ordem de data");
  }

  // Tocar numa peça: abre o livro ou o enfeite (no modo Organizar, não faz nada)
  function tocarPeca(chave) {
    if (modoOrganizar || Date.now() - ultimoArrasto < 400) return;
    if (chave[0] === "l") abrirDetalhes(chave.slice(2)); else abrirDecoracao(chave.slice(2));
  }

  $("estantes").addEventListener("pointerdown", (e) => {
    if (!modoOrganizar || arrasto || (e.pointerType === "mouse" && e.button !== 0)) return;
    const peca = e.target.closest(".livro-estante[data-chave]");
    if (!peca) return;
    arrasto = { peca, id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
                toque: e.pointerType !== "mouse", iniciou: false, mudou: false, clone: null, dx: 0, dy: 0, timer: 0 };
    // No celular é preciso segurar um instante (senão não dá para rolar a página nem trocar de estante)
    if (arrasto.toque) arrasto.timer = setTimeout(iniciarArrasto, 220);
  });

  document.addEventListener("pointermove", (e) => {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    arrasto.x = e.clientX; arrasto.y = e.clientY;
    if (!arrasto.iniciou) {
      const distancia = Math.hypot(e.clientX - arrasto.x0, e.clientY - arrasto.y0);
      if (arrasto.toque) { if (distancia > 10) soltarSemArrastar(); }   // mexeu antes de segurar: é rolagem
      else if (distancia > 4) iniciarArrasto();
      return;
    }
    moverArrasto();
  });

  document.addEventListener("pointerup", (e) => { if (arrasto && e.pointerId === arrasto.id) terminarArrasto(false); });
  document.addEventListener("pointercancel", (e) => { if (arrasto && e.pointerId === arrasto.id) terminarArrasto(true); });
  // Depois que a peça é pega, o dedo não pode rolar a página
  document.addEventListener("touchmove", (e) => { if (arrasto && arrasto.iniciou && e.cancelable) e.preventDefault(); }, { passive: false });
  $("estantes").addEventListener("contextmenu", (e) => { if (modoOrganizar) e.preventDefault(); });
  $("estantes").addEventListener("dragstart", (e) => e.preventDefault());

  function soltarSemArrastar() {
    if (!arrasto) return;
    clearTimeout(arrasto.timer);
    arrasto = null;
  }

  function iniciarArrasto() {
    const a = arrasto;
    if (!a || a.iniciou) return;
    clearTimeout(a.timer);
    a.iniciou = true;

    const r = a.peca.getBoundingClientRect();
    a.dx = a.x - r.left; a.dy = a.y - r.top;
    a.clone = a.peca.cloneNode(true);
    a.clone.className = "livro-estante peca-voando";
    a.clone.removeAttribute("data-chave");
    a.clone.removeAttribute("onclick");
    a.clone.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    document.body.appendChild(a.clone);
    a.peca.classList.add("fantasma");

    try { a.peca.setPointerCapture(a.id); } catch (err) {}
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
    document.body.classList.add("arrastando");
    $("estantes").classList.add("sem-ima");
    rolarSePreciso();
  }

  // Qual prateleira está embaixo do dedo?
  function acharFileira(x, y) {
    for (const f of document.querySelectorAll("#estantes .fileira")) {
      const r = f.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top - 2 && y <= r.bottom + 10) return f;
    }
    return null;
  }

  function moverArrasto() {
    const a = arrasto;
    if (!a || !a.iniciou) return;
    a.clone.style.left = (a.x - a.dx) + "px";
    a.clone.style.top = (a.y - a.dy) + "px";

    const f = acharFileira(a.x, a.y);
    if (!f) return;
    const outras = [...f.querySelectorAll(".livro-estante[data-chave]")].filter(n => n !== a.peca);
    let i = 0;
    for (const n of outras) { const r = n.getBoundingClientRect(); if (r.left + r.width / 2 < a.x) i++; }
    const ref = outras[i] || null;

    if (a.peca.parentNode === f) {
      if (ref ? a.peca.nextElementSibling === ref : a.peca === f.lastElementChild) return;   // já está aí
    } else if (outras.length) {
      const usado = outras.reduce((s, n) => s + n.offsetWidth + 4, 0);
      if (usado + a.peca.offsetWidth > f.clientWidth - 12) return;                            // não cabe nessa prateleira
    }
    f.insertBefore(a.peca, ref);
    a.mudou = true;
  }

  // Perto das bordas da tela, a página rola sozinha (para cima/baixo e para a estante do lado)
  function rolarSePreciso() {
    const a = arrasto;
    if (!a || !a.iniciou) return;
    const topo = 110, base = window.innerHeight - 110;
    let v = 0;
    if (a.y < topo) v = -Math.ceil((topo - a.y) / 6);
    else if (a.y > base) v = Math.ceil((a.y - base) / 6);
    if (v) window.scrollBy(0, Math.max(-22, Math.min(22, v)));

    const t = $("estantes"), rt = t.getBoundingClientRect();
    let h = 0;
    if (a.x < rt.left + 24) h = -10; else if (a.x > rt.right - 24) h = 10;
    if (h) t.scrollLeft += h;

    if (v || h) moverArrasto();
    rolagemAuto = requestAnimationFrame(rolarSePreciso);
  }

  function arrumacaoDaTela() {
    const est = [...document.querySelectorAll("#estantes .movel")].map(m =>
      [...m.querySelectorAll(".fileira")].map(f => [...f.querySelectorAll("[data-chave]")].map(n => n.dataset.chave)));
    while (est.length > 1 && est[est.length - 1].every(f => !f.length)) est.pop();
    return est;
  }

  function terminarArrasto(cancelou) {
    const a = arrasto;
    if (!a) return;
    clearTimeout(a.timer);
    arrasto = null;
    cancelAnimationFrame(rolagemAuto);
    if (!a.iniciou) return;
    document.body.classList.remove("arrastando");
    $("estantes").classList.remove("sem-ima");
    if (a.clone) a.clone.remove();
    a.peca.classList.remove("fantasma");
    ultimoArrasto = Date.now();
    if (!cancelou && a.mudou) {
      arrumacao = arrumacaoDaTela();
      guardar("arrumacaoEstante", JSON.stringify(arrumacao));
    }
    redesenharDepois = false;
    const rolagem = $("estantes").scrollLeft;
    desenharEstante();
    const t = $("estantes");
    t.scrollLeft = Math.round(rolagem / Math.max(1, t.clientWidth)) * t.clientWidth;
    atualizarPontos();
  }

  // ====== ESTANTE: PAPEL DE PAREDE, MODELO, ESTRUTURA E LUZES ======
  // Devolve o "estilo" (CSS) da parede para um papel e uma cor
  function estiloPapel(id, cor) {
    if (id === "minha" && papelProprio) {
      return `background-color:${cor};background-image:url(${papelProprio});background-size:cover;background-position:center;background-repeat:no-repeat`;
    }
    const p = PAPEIS[id] || PAPEIS.liso;
    return `background-color:${cor};background-image:${p.imagem};background-size:${p.tamanho}`;
  }

  function aplicarEstante() {
    $("parede").style.cssText = estiloPapel(papelEscolhido, corParedeAtual);
    const m = MODELOS[modeloEscolhido];
    const e = $("estantes");
    e.style.setProperty("--m-moldura", m.moldura);
    e.style.setProperty("--m-fundo", m.fundo);
    e.style.setProperty("--m-tabua", m.tabua);
    e.style.setProperty("--grao-v", graoSvg("v", m));
    e.style.setProperty("--grao-h", graoSvg("h", m));
    if (luzesEscolhidas !== "nenhuma") {
      const luz = desenhosLuzes(luzesEscolhidas);
      e.style.setProperty("--fio", luz.fio);
      e.style.setProperty("--luz-a", luz.a);
      e.style.setProperty("--luz-b", luz.b);
    }
  }

  function htmlPersonalizar() {
    const estruturas = [["inteira", "Estante inteira"], ["prateleiras", "Só prateleiras"]].map(([id, nome]) =>
      `<button class="${estruturaEscolhida === id ? "ativo" : ""}" onclick="escolherEstrutura('${id}')">${nome}</button>`).join("");

    const luzes = Object.entries(LUZES).map(([id, l]) =>
      `<button class="${luzesEscolhidas === id ? "ativo" : ""}" onclick="escolherLuzes('${id}')">${l.nome}</button>`).join("");

    const modelos = Object.entries(MODELOS).map(([id, m]) => `
      <button class="chip ${modeloEscolhido === id ? "ativo" : ""}" onclick="escolherModelo('${id}')">
        <span class="amostra-modelo" style="background-color:${m.fundo}; background-image:${graoSvg("v", m)}; border-color:${m.moldura}"></span>${m.nome}
      </button>`).join("");

    const papeis = Object.entries(PAPEIS).map(([id, p]) => `
      <button class="chip ${papelEscolhido === id ? "ativo" : ""}" onclick="escolherPapel('${id}')">
        <span class="tile-papel" data-papel="${id}" style="${estiloPapel(id, corParedeAtual)}"></span>${p.nome}
      </button>`).join("");

    const minha = `
      <button class="chip ${papelEscolhido === "minha" ? "ativo" : ""}" onclick="escolherPapel('minha')">
        ${papelProprio
          ? `<span class="tile-papel" data-papel="minha" style="${estiloPapel("minha", corParedeAtual)}"></span>`
          : `<span class="tile-papel" style="background:var(--campo)">+</span>`}
        Minha imagem
      </button>`;

    const amostras = CORES_PAREDE.map(c =>
      `<button class="amostra" style="background:${c}" onclick="escolherCorParede('${c}')" aria-label="Escolher cor"></button>`
    ).join("");

    return `
      <h3 class="titulo-folha">Personalizar a estante</h3>
      <p class="rotulo">Estrutura</p>
      <div class="grupo">${estruturas}</div>
      <p class="rotulo">Madeira</p>
      <div class="chips">${modelos}</div>
      <p class="rotulo">Luzes (em todas as prateleiras)</p>
      <div class="grupo quebra">${luzes}</div>
      <p class="rotulo">Cor do fundo</p>
      <div class="linha-cor">
        <input type="color" id="corParede" value="${corParedeAtual}" oninput="escolherCorParede(this.value)">
        <span id="amostras">${amostras}</span>
      </div>
      <p class="rotulo">Papel de parede</p>
      <div class="chips">${papeis}${minha}</div>
      ${papelProprio ? `<div class="links">
        <button class="link" onclick="escolherArquivoPapel()">Trocar imagem</button>
        <button class="link" onclick="removerPapelProprio()">Remover imagem</button></div>` : ""}
      <button class="fechar" onclick="fecharFolha()">Pronto</button>`;
  }

  function abrirPersonalizar() { mostrarFolha(htmlPersonalizar()); }

  function escolherCorParede(cor) {
    corParedeAtual = cor;
    guardar("corParede", cor);
    aplicarEstante();
    // atualiza as miniaturas sem refazer a folha (senão o seletor de cor fecharia)
    document.querySelectorAll(".tile-papel[data-papel]").forEach(t => { t.style.cssText = estiloPapel(t.dataset.papel, cor); });
    const campo = $("corParede");
    if (campo) campo.value = cor;
  }

  function escolherPapel(id) {
    if (id === "minha" && !papelProprio) { escolherArquivoPapel(); return; }
    papelEscolhido = id;
    guardar("papelParede", id);
    aplicarEstante();
    atualizarFolha(htmlPersonalizar());
  }

  function escolherModelo(id) {
    modeloEscolhido = id;
    guardar("modeloEstante", id);
    aplicarEstante();
    atualizarFolha(htmlPersonalizar());
  }

  function escolherEstrutura(id) {
    estruturaEscolhida = id;
    guardar("estruturaEstante", id);
    desenharEstante();
    atualizarFolha(htmlPersonalizar());
  }

  function escolherLuzes(id) {
    luzesEscolhidas = id;
    guardar("luzesEstante", id);
    aplicarEstante();
    desenharEstante();
    atualizarFolha(htmlPersonalizar());
  }

  function escolherArquivoPapel() { $("arquivoPapel").click(); }

  function removerPapelProprio() {
    papelProprio = "";
    try { localStorage.removeItem("papelProprio"); } catch (e) {}
    if (papelEscolhido === "minha") { papelEscolhido = "liso"; guardar("papelParede", "liso"); }
    aplicarEstante();
    atualizarFolha(htmlPersonalizar());
  }

  // Lê a foto escolhida, diminui (para caber no navegador) e usa como papel de parede
  $("arquivoPapel").addEventListener("change", (e) => {
    const arquivo = e.target.files[0];
    e.target.value = "";
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 900 / Math.max(img.width, img.height));
        const tela = document.createElement("canvas");
        tela.width = Math.round(img.width * escala);
        tela.height = Math.round(img.height * escala);
        tela.getContext("2d").drawImage(img, 0, 0, tela.width, tela.height);
        const dados = tela.toDataURL("image/jpeg", 0.8);

        if (!guardar("papelProprio", dados)) { avisar("Essa imagem é grande demais para guardar"); return; }
        papelProprio = dados;
        papelEscolhido = "minha";
        guardar("papelParede", "minha");
        aplicarEstante();
        if (!$("folha").hidden) atualizarFolha(htmlPersonalizar());
      };
      img.onerror = () => avisar("Não consegui abrir essa imagem");
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });

  // ====== ESTANTE: ENFEITES ======
  function salvarDecoracoes() { guardar("decoracoes", JSON.stringify(decoracoes)); }

  function abrirDecorar() {
    const opcoes = Object.entries(DECORACOES).map(([id, d]) => `
      <button class="opcao-deco" onclick="adicionarDecoracao('${id}')">
        <span class="fig">${svgDeco(id)}</span>${d.nome}
      </button>`).join("");
    const minha = `
      <button class="opcao-deco" onclick="escolherArquivoDeco()">
        <span class="fig"><span class="mais-deco">+</span></span>Minha imagem
      </button>`;
    mostrarFolha(`
      <h3 class="titulo-folha">Decorar a estante</h3>
      <p class="dica">Toque para colocar na estante. Depois use o botão Organizar para arrastar até o lugar que você quiser. Dica: uma imagem PNG sem fundo fica mais realista.</p>
      <div class="opcoes-deco">${opcoes}${minha}</div>
      <button class="fechar" onclick="fecharFolha()">Pronto</button>`);
  }

  function novoIdDeco() { return "d" + Date.now() + Math.floor(Math.random() * 1000); }

  function adicionarDecoracao(tipo) {
    decoracoes.push({ id: novoIdDeco(), tipo: tipo, lado: "fim", escala: 1 });
    salvarDecoracoes();
    desenharEstante();
    avisar(DECORACOES[tipo].nome + " na estante");
  }

  function escolherArquivoDeco() { $("arquivoDeco").click(); }

  // Lê a imagem escolhida, diminui e guarda (em PNG, para manter o fundo transparente)
  $("arquivoDeco").addEventListener("change", (e) => {
    const arquivo = e.target.files[0];
    e.target.value = "";
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 220 / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * escala));
        const h = Math.max(1, Math.round(img.height * escala));
        const tela = document.createElement("canvas");
        tela.width = w; tela.height = h;
        tela.getContext("2d").drawImage(img, 0, 0, w, h);
        const dados = tela.toDataURL("image/png");

        const id = novoIdDeco();
        if (!guardar("decoImg_" + id, dados)) { avisar("Essa imagem é grande demais para guardar"); return; }
        cacheImagensDeco[id] = dados;
        decoracoes.push({ id: id, tipo: "imagem", lado: "fim", escala: 1, w: w, h: h });
        salvarDecoracoes();
        fecharFolha();
        desenharEstante();
        avisar("Sua imagem está na estante");
      };
      img.onerror = () => avisar("Não consegui abrir essa imagem");
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });

  function htmlDecoracao(d) {
    const nome = d.tipo === "imagem" ? "Minha imagem" : DECORACOES[d.tipo].nome;
    const tamanhos = [[0.8, "Pequeno"], [1, "Médio"], [1.2, "Grande"]].map(([v, n]) =>
      `<button class="${(d.escala || 1) === v ? "ativo" : ""}" onclick="mudarTamanhoDeco('${d.id}', ${v})">${n}</button>`).join("");
    return `
      <h3 class="titulo-folha">${nome}</h3>
      <p class="dica">Para mudar de lugar, use o botão Organizar e arraste.</p>
      <p class="rotulo">Tamanho</p>
      <div class="grupo">${tamanhos}</div>
      <button class="perigo" onclick="removerDecoracao('${d.id}')">Tirar da estante</button>
      <button class="fechar" onclick="fecharFolha()">Fechar</button>`;
  }

  function abrirDecoracao(id) {
    const d = decoracoes.find(x => x.id === id);
    if (d) mostrarFolha(htmlDecoracao(d));
  }

  function mudarTamanhoDeco(id, escala) {
    const d = decoracoes.find(x => x.id === id);
    d.escala = escala;
    salvarDecoracoes();
    desenharEstante();
    atualizarFolha(htmlDecoracao(d));
  }

  function removerDecoracao(id) {
    const d = decoracoes.find(x => x.id === id);
    if (d && d.tipo === "imagem") {
      try { localStorage.removeItem("decoImg_" + id); } catch (e) {}
      delete cacheImagensDeco[id];
    }
    decoracoes = decoracoes.filter(x => x.id !== id);
    salvarDecoracoes();
    desenharEstante();
    fecharFolha();
  }

  // ====== FOLHA (sobe de baixo) ======
  function mostrarFolha(html) {
    $("folha").innerHTML = html;
    $("folha").scrollTop = 0;
    $("fundoFolha").hidden = false;
    $("folha").hidden = false;
  }

  // Troca o conteúdo sem pular a rolagem
  function atualizarFolha(html) {
    const rolagem = $("folha").scrollTop;
    $("folha").innerHTML = html;
    $("folha").scrollTop = rolagem;
  }

  function fecharFolha() {
    $("fundoFolha").hidden = true;
    $("folha").hidden = true;
  }

  // ====== DESENHAR: RESUMO (DASHBOARDS) ======
  const MESES_CURTOS = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
  let anoResumo = String(new Date().getFullYear());

  function metaDoAno() { return parseInt(localStorage.getItem("metaAnual"), 10) || 0; }

  // Sequência = meses seguidos com pelo menos um livro lido
  function sequencias(lidos) {
    const meses = new Set(lidos.map(l => l.dataLido.slice(0, 7)));
    const chave = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    let atual = 0;
    const d = new Date(); d.setDate(1);
    if (!meses.has(chave(d))) d.setMonth(d.getMonth() - 1);   // o mês atual ainda não acabou: não quebra a sequência
    while (meses.has(chave(d))) { atual++; d.setMonth(d.getMonth() - 1); }
    let melhor = 0, corrida = 0, anterior = null;
    [...meses].sort().forEach(m => {
      const [a, mm] = m.split("-").map(Number);
      const n = a * 12 + mm;
      corrida = (anterior !== null && n === anterior + 1) ? corrida + 1 : 1;
      melhor = Math.max(melhor, corrida);
      anterior = n;
    });
    return { atual, melhor };
  }

  function barrasHorizontais(itens, classeNome) {
    const maior = Math.max(1, ...itens.map(i => i.valor));
    return `<div class="barras-h">` + itens.map(i => `
      <div class="barra-h" data-dica="${limpar(i.dica)}">
        <span class="nome ${classeNome || ""}">${i.rotulo}</span>
        <span class="trilho"><div style="width:${i.valor ? i.valor / maior * 100 : 0}%"></div></span>
        <span class="num">${i.valor}</span>
      </div>`).join("") + `</div>`;
  }

  function tabelaDados(linhas) {
    return `<details class="tabela-dados"><summary>Ver em tabela</summary><table>`
      + linhas.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("") + `</table></details>`;
  }

  function desenharResumo() {
    const todosLidos = minhaLista.filter(l => l.status === "lido" && l.dataLido);
    const anoAtual = String(new Date().getFullYear());
    const anos = [...new Set([anoAtual, ...todosLidos.map(l => l.dataLido.slice(0, 4))])].sort().reverse();
    if (!anos.includes(anoResumo)) anoResumo = anoAtual;
    const lidos = todosLidos.filter(l => l.dataLido.slice(0, 4) === anoResumo);
    const qtd = lidos.length;

    // 1) Meta do ano
    const meta = metaDoAno();
    let cartaoMeta;
    if (meta) {
      const pct = Math.min(100, Math.round(qtd / meta * 100));
      let texto;
      if (qtd >= meta) texto = "Meta batida! 🎉";
      else if (anoResumo === anoAtual) {
        const hojeD = new Date();
        const mesesRestantes = 12 - hojeD.getMonth();
        const porMes = Math.ceil((meta - qtd) / mesesRestantes);
        texto = `Faltam ${meta - qtd}. Dá cerca de ${porMes} por mês até dezembro.`;
      } else texto = `Faltaram ${meta - qtd} para a meta.`;
      cartaoMeta = `
        <div class="cartao">
          <h3>Meta de ${anoResumo}</h3>
          <div class="meta-numeros"><strong>${qtd}</strong><span>de ${meta} livros · ${pct}%</span></div>
          <div class="barra-meta" role="progressbar" aria-valuenow="${qtd}" aria-valuemin="0" aria-valuemax="${meta}"><div style="width:${pct}%"></div></div>
          <p class="meta-texto">${texto}</p>
        </div>`;
    } else {
      cartaoMeta = `
        <div class="cartao">
          <h3>Meta de ${anoResumo}</h3>
          <div class="meta-numeros"><strong>${qtd}</strong><span>${qtd === 1 ? "livro lido" : "livros lidos"}</span></div>
          <p class="meta-texto">Você ainda não tem meta. <button class="link" onclick="mostrarAba('perfil'); $('campoMeta').focus()">Definir no Perfil</button></p>
        </div>`;
    }

    // 2) Números rápidos
    const comNota = lidos.filter(l => l.nota);
    const media = comNota.length ? (comNota.reduce((s, l) => s + l.nota, 0) / comNota.length) : 0;
    const seq = sequencias(todosLidos);
    const blocos = `
      <div class="blocos">
        <div class="bloco-num"><strong>${qtd}</strong><span>lidos em ${anoResumo}</span></div>
        <div class="bloco-num"><strong>${media ? media.toFixed(1).replace(".", ",") + " ★" : "–"}</strong><span>nota média</span></div>
        <div class="bloco-num"><strong>${seq.atual}</strong><span>${seq.atual === 1 ? "mês seguido" : "meses seguidos"} lendo</span></div>
        <div class="bloco-num"><strong>${seq.melhor}</strong><span>melhor sequência (meses)</span></div>
      </div>`;

    // 3) Livros lidos por mês
    const porMes = MESES_CURTOS.map((_, i) => lidos.filter(l => Number(l.dataLido.slice(5, 7)) === i + 1));
    const maiorMes = Math.max(1, ...porMes.map(m => m.length));
    const mesHoje = anoResumo === anoAtual ? new Date().getMonth() : -1;
    const colunas = porMes.map((m, i) => {
      const nomes = m.map(l => l.titulo).slice(0, 3).join(", ") + (m.length > 3 ? "…" : "");
      const dica = `${MESES_CURTOS[i]}: ${m.length} ${m.length === 1 ? "livro" : "livros"}${m.length ? " · " + nomes : ""}`;
      return `<div class="mes ${i === mesHoje ? "atual" : ""}" data-dica="${limpar(dica)}">
                ${m.length ? `<span class="valor">${m.length}</span>` : ""}
                <div class="coluna" style="height:${m.length / maiorMes * 100}%"></div>
              </div>`;
    }).join("");
    const cartaoMeses = `
      <div class="cartao">
        <h3>Livros lidos por mês</h3>
        ${qtd ? `<div class="meses">${colunas}</div>
        <div class="rotulos-meses">${MESES_CURTOS.map(m => `<span>${m[0]}</span>`).join("")}</div>
        ${tabelaDados(porMes.map((m, i) => [MESES_CURTOS[i], m.length]))}`
        : `<p class="vazio-dados">Nenhum livro lido em ${anoResumo} ainda.</p>`}
      </div>`;

    // 4) Minhas notas
    const notas = [5, 4, 3, 2, 1].map(n => ({ n, qtd: lidos.filter(l => l.nota === n).length }));
    const semNota = qtd - comNota.length;
    const cartaoNotas = `
      <div class="cartao">
        <h3>Minhas notas</h3>
        ${comNota.length ? `<p class="sub">${comNota.length} com nota${semNota ? ` · ${semNota} sem nota` : ""}</p>`
          + barrasHorizontais(notas.map(x => ({ rotulo: "★".repeat(x.n), valor: x.qtd, dica: `${x.n} ${x.n === 1 ? "estrela" : "estrelas"}: ${x.qtd}` })), "estrelas-txt")
          : `<p class="vazio-dados">Dê estrelas aos livros lidos (na página do livro) para ver aqui.</p>`}
      </div>`;

    // 5) Autores mais lidos
    const contagem = {};
    lidos.forEach(l => (l.autor || "Autor desconhecido").split(",").map(a => a.trim()).filter(Boolean)
      .forEach(a => { contagem[a] = (contagem[a] || 0) + 1; }));
    const autores = Object.entries(contagem).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 5);
    const cartaoAutores = `
      <div class="cartao">
        <h3>Autores mais lidos</h3>
        ${autores.length ? barrasHorizontais(autores.map(([a, n]) => ({ rotulo: limpar(a), valor: n, dica: `${a}: ${n} ${n === 1 ? "livro" : "livros"}` })))
          : `<p class="vazio-dados">Aparece aqui quando você terminar livros em ${anoResumo}.</p>`}
      </div>`;

    $("aba-resumo").innerHTML = `
      <div class="painel-dados">
        <div class="topo-dados">
          <h2>Minhas leituras</h2>
          <select onchange="anoResumo = this.value; desenharResumo()" aria-label="Ano">
            ${anos.map(a => `<option value="${a}" ${a === anoResumo ? "selected" : ""}>${a}</option>`).join("")}
          </select>
        </div>
        ${cartaoMeta}${blocos}${cartaoMeses}${cartaoNotas}${cartaoAutores}
      </div>`;
  }

  // Dica ao passar o mouse ou tocar numa barra
  function mostrarDica(e) {
    const alvo = e.target.closest("[data-dica]");
    const dica = $("dicaDados");
    if (!alvo) { dica.hidden = true; return; }
    const r = alvo.getBoundingClientRect();
    dica.textContent = alvo.dataset.dica;
    dica.hidden = false;
    const largura = dica.offsetWidth;
    const x = Math.min(window.innerWidth - largura / 2 - 8, Math.max(largura / 2 + 8, r.left + r.width / 2));
    dica.style.left = x + "px";
    dica.style.top = (r.top - 6) + "px";
  }
  $("aba-resumo").addEventListener("pointerover", mostrarDica);
  $("aba-resumo").addEventListener("pointerdown", mostrarDica);
  $("aba-resumo").addEventListener("pointerleave", () => { $("dicaDados").hidden = true; });
  window.addEventListener("scroll", () => { $("dicaDados").hidden = true; }, { passive: true });

  // ====== DESENHAR: PERFIL ======
  function desenharPerfil() {
    const nome = localStorage.getItem("nomeLeitor") || "";
    const foto = localStorage.getItem("fotoPerfil") || "";
    const frase = localStorage.getItem("fraseFavorita") || "";
    const anoAtual = String(new Date().getFullYear());

    $("foto").style.backgroundImage = foto ? `url(${foto})` : "";
    $("foto").classList.toggle("com-foto", !!foto);
    $("linksFoto").innerHTML = foto
      ? `<button class="link" onclick="$('arquivoFoto').click()">Trocar foto</button><button class="link" onclick="removerFoto()">Remover</button>`
      : `<button class="link" onclick="$('arquivoFoto').click()">Adicionar foto</button>`;
    $("nomePerfil").textContent = nome || "Leitor(a)";
    $("frasePerfil").textContent = frase ? "“" + frase + "”" : "";
    $("anoMeta").textContent = anoAtual;

    // Livro favorito: escolhe entre os seus livros
    const favId = localStorage.getItem("livroFavorito") || "";
    const opcoes = [...minhaLista].sort((a, b) => a.titulo.localeCompare(b.titulo));
    $("campoFavorito").innerHTML = `<option value="">Escolha um dos seus livros</option>`
      + opcoes.map(l => `<option value="${l.id}" ${l.id === favId ? "selected" : ""}>${limpar(l.titulo)}</option>`).join("");
    const fav = minhaLista.find(l => l.id === favId);
    $("mostraFavorito").innerHTML = fav ? `
      <div class="favorito">
        ${fav.capa ? `<img src="${fav.capa}" alt="">` : `<div class="sem-capa-mini">${limpar(fav.titulo)}</div>`}
        <div><h4>${limpar(fav.titulo)}</h4><p>${limpar(fav.autor)}</p></div>
      </div>` : "";

    const lidosNoAno = minhaLista.filter(l => l.status === "lido" && l.dataLido.slice(0, 4) === anoAtual).length;
    $("resumo").innerHTML =
      `<p>📚 ${minhaLista.length} livros na sua lista</p>`
      + `<p>✅ ${lidosNoAno} lidos em ${anoAtual}</p>`;
  }

  $("campoNome").value = localStorage.getItem("nomeLeitor") || "";
  $("campoNome").addEventListener("input", () => {
    localStorage.setItem("nomeLeitor", $("campoNome").value.trim());
    desenharInicio();
    desenharPerfil();
  });

  $("campoMeta").value = metaDoAno() || "";
  $("campoMeta").addEventListener("input", () => {
    const n = Math.max(0, Math.min(999, parseInt($("campoMeta").value, 10) || 0));
    guardar("metaAnual", String(n));
    desenharResumo();
  });

  $("campoFrase").value = localStorage.getItem("fraseFavorita") || "";
  $("campoFrase").addEventListener("input", () => {
    guardar("fraseFavorita", $("campoFrase").value.trim());
    $("frasePerfil").textContent = $("campoFrase").value.trim() ? "“" + $("campoFrase").value.trim() + "”" : "";
  });

  $("campoFavorito").addEventListener("change", () => {
    guardar("livroFavorito", $("campoFavorito").value);
    desenharPerfil();
  });

  // Foto: diminui para 320px (para caber no navegador) e corta em quadrado
  $("arquivoFoto").addEventListener("change", (e) => {
    const arquivo = e.target.files[0];
    e.target.value = "";
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const lado = Math.min(img.width, img.height);
        const tela = document.createElement("canvas");
        tela.width = tela.height = 320;
        tela.getContext("2d").drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, 320, 320);
        if (!guardar("fotoPerfil", tela.toDataURL("image/jpeg", 0.85))) { avisar("Essa foto é grande demais para guardar"); return; }
        desenharPerfil();
      };
      img.onerror = () => avisar("Não consegui abrir essa imagem");
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });

  function removerFoto() {
    try { localStorage.removeItem("fotoPerfil"); } catch (e) {}
    desenharPerfil();
  }

  function desenharTudo() {
    desenharInicio();
    desenharLista();
    desenharEstante();
    desenharResumo();
    desenharPerfil();
    desenharLivro();
  }

  // ====== COMEÇAR ======
  aplicarTema();
  aplicarEstante();
  desenharTudo();
  minhaLista.forEach(extrairCor);   // descobre a cor das capas que ainda não tem
</script>
