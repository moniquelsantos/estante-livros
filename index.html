<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Estante</title>

  <!-- Aplica o tema (claro/escuro) antes da página aparecer, para não piscar -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tema") || "auto";
        var escuro = t === "escuro" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-tema", escuro ? "escuro" : "claro");
      } catch (e) {}
    })();
  </script>

  <style>
    /* ===== CORES: tema claro (branco) ===== */
    :root {
      --papel: #ffffff;          /* fundo das páginas */
      --papel-escuro: #f4f1ec;   /* painel de busca */
      --barra: #ffffff;          /* barras de cima e de baixo */
      --linha: #e6e1d8;          /* linhas finas de separação */
      --icone: #8d8d8d;          /* ícone apagado do menu */
      --icone-ativo: #2f5d4e;    /* ícone da aba atual */
      --campo: #faf8f4;          /* fundo de campos e seletores */
      --borda: #cdbfa6;
      --tinta: #2a2118;          /* texto principal */
      --suave: #6b6256;          /* texto secundário */
      --suave2: #8a8277;
      --card: #ffffff;
      --painel: rgba(255,255,255,.95);
      --fora: #e9e6e0;           /* fundo fora da "tela do celular" */
      --destaque: #2f5d4e;
      --perigo: #a33;
      --estrela: #e0a526;
      color-scheme: light;
    }
    /* ===== CORES: tema escuro (preto) ===== */
    :root[data-tema="escuro"] {
      --papel: #111111;
      --papel-escuro: #1c1c1e;
      --barra: #1a1a1a;
      --linha: #2c2c2e;
      --icone: #8e8e93;
      --icone-ativo: #7fcfb2;
      --campo: #2a2a2c;
      --borda: #4a463f;
      --tinta: #f2efe9;
      --suave: #b5aea3;
      --suave2: #8e887e;
      --card: #242426;
      --painel: rgba(28,28,30,.95);
      --fora: #000000;
      --destaque: #3f8a73;
      --perigo: #ff7b7b;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }   /* garante que "hidden" sempre esconde */
    body { margin: 0; background: var(--fora); color: var(--tinta); font-family: Georgia, "Times New Roman", serif; }
    button, input, select, textarea { font-family: inherit; font-size: 14px; }
    input, select, textarea { color: var(--tinta); }
    .icone { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8;
             stroke-linecap: round; stroke-linejoin: round; }

    /* O "celular": uma coluna centralizada */
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--papel);
           padding-bottom: 76px; box-shadow: 0 0 20px rgba(0,0,0,.25); }

    /* Topo */
    .topo { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 16px; background: var(--barra); color: var(--tinta);
            border-bottom: 1px solid var(--linha); }
    .topo-esq { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .topo h1 { margin: 0; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lupa, .voltar, .seta { background: none; border: none; cursor: pointer; color: var(--tinta); padding: 4px; display: flex; }
    .voltar { margin-left: -6px; }

    /* Painel de busca (desce quando toca na lupa) */
    .painel-busca { background: var(--papel-escuro); padding: 12px 16px 16px;
                    border-bottom: 3px solid var(--borda); animation: descer .25s ease; }
    @keyframes descer { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
    .linha-busca { display: flex; gap: 8px; }
    .linha-busca input { flex: 1; min-width: 0; padding: 10px; border: 1px solid var(--borda);
                         border-radius: 6px; background: var(--campo); }
    .botao { background: var(--destaque); color: #fff; border: none; border-radius: 6px;
             padding: 10px 14px; cursor: pointer; }
    .opcoes-busca { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0; font-size: 13px; }
    .opcoes-busca select { padding: 6px; border-radius: 6px; border: 1px solid var(--borda); background: var(--campo); }
    #resultados { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .msg { grid-column: 1 / -1; font-style: italic; color: var(--suave); }
    .card { background: var(--card); border-radius: 8px; padding: 10px; text-align: center;
            display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    .card img { height: 130px; margin: 0 auto; border-radius: 3px; }
    .card .sem-capa { height: 130px; display: flex; align-items: center; justify-content: center;
                      background: var(--papel-escuro); font-size: 12px; color: var(--suave); border-radius: 3px; }
    .card h3 { margin: 6px 0 0; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
               -webkit-box-orient: vertical; overflow: hidden; }
    .card p { margin: 0 0 6px; font-size: 11px; color: var(--suave); }
    .card button { background: var(--campo); color: var(--tinta); border: 1px solid var(--borda); border-radius: 6px;
                   padding: 7px 4px; font-size: 12px; cursor: pointer; }

    /* Abas */
    .aba { display: none; }
    .aba.ativa { display: block; }

    /* Início: no máximo 4 capas por categoria */
    .saudacao { margin: 14px 16px 0; font-size: 15px; color: var(--suave); }
    .secao-topo { display: flex; justify-content: space-between; align-items: center; margin: 20px 16px 10px; }
    .secao-topo h2 { margin: 0; font-size: 18px; }
    .secao-topo small { color: var(--suave2); font-weight: normal; }
    .grade-capas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 16px 6px; }
    .grade-capas img, .sem-capa-mini { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px;
                   cursor: pointer; box-shadow: 1px 2px 6px rgba(0,0,0,.35); }
    .sem-capa-mini { padding: 6px; display: flex; align-items: center; text-align: center; font-size: 11px;
                     background: var(--destaque); color: #fff; overflow: hidden; word-break: break-word; }
    .vazio { margin: 0 16px; font-size: 14px; font-style: italic; color: var(--suave2); }

    /* Página com todos os livros de uma categoria (estilo Kindle) */
    .qtd-lista { margin: 14px 16px 4px; font-size: 13px; color: var(--suave2); }
    .item-lista { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--linha); cursor: pointer; }
    .item-lista .capa-lista { width: 72px; flex-shrink: 0; }
    .item-lista .capa-lista img, .item-lista .capa-lista .sem-capa-mini { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
    .item-lista h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.25; }
    .item-lista p { margin: 0; font-size: 14px; color: var(--suave); }
    .item-lista .data { margin-top: 6px; font-size: 12px; color: var(--suave2); }
    .item-lista .estrelas-mini { margin-top: 6px; font-size: 14px; color: var(--estrela); letter-spacing: 1px; }

    /* Página de um livro */
    .livro-pagina { padding: 16px; }
    .livro-cabeca { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 4px; }
    .livro-cabeca .capa-grande { width: 110px; flex-shrink: 0; }
    .livro-cabeca .capa-grande img, .livro-cabeca .capa-grande .sem-capa-mini { width: 100%; aspect-ratio: 2 / 3; object-fit: cover;
                   border-radius: 3px; box-shadow: 2px 3px 8px rgba(0,0,0,.4); cursor: default; }
    .livro-cabeca h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.25; }
    .livro-cabeca p { margin: 0; color: var(--suave); font-size: 14px; }
    .estrelas { display: flex; gap: 4px; }
    .estrelas button { background: none; border: none; padding: 2px; cursor: pointer; color: var(--suave2); display: flex; }
    .estrelas button.cheia { color: var(--estrela); }
    .estrelas svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
    .estrelas button.cheia svg { fill: currentColor; }
    textarea.anotacao { width: 100%; min-height: 170px; padding: 12px; border: 1px solid var(--borda); border-radius: 8px;
                        background: var(--campo); font-size: 15px; line-height: 1.5; resize: vertical; }
    .salvo { margin: 6px 0 0; font-size: 12px; color: var(--suave2); min-height: 16px; }

    /* Estante */
    /* A parede desce por trás do menu de baixo, sem faixa vazia */
    .parede { background: #2f5d4e; padding: 16px 8px 92px; margin-bottom: -76px; min-height: calc(100vh - 57px); }
    .painel-estante { background: var(--painel); border-radius: 10px; padding: 10px; margin: 0 8px 16px; }
    .filtros { display: flex; gap: 8px; margin-bottom: 10px; }
    .filtros select { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--borda); background: var(--campo); }
    .linha-contagem { display: flex; justify-content: space-between; align-items: center; }
    .contagem { margin: 0; font-size: 13px; color: var(--suave); }
    .botao-personalizar { display: flex; align-items: center; gap: 6px; background: var(--destaque); color: #fff;
                          border: none; border-radius: 6px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
    .botao-personalizar .icone { width: 18px; height: 18px; }

    /* ===== Estante: móvel inteiro ou só prateleiras ===== */
    /* As cores e a textura de madeira vêm do JavaScript (variáveis --m-... e --grao-...) */
    /* As estantes ficam lado a lado: deslize para o lado para ver a próxima */
    #estantes { display: flex; align-items: flex-start; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
                scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 28px; }
    #estantes::-webkit-scrollbar { display: none; }
    #estantes.sem-ima { scroll-snap-type: none; }
    .vaga { flex: 0 0 100%; box-sizing: border-box; padding: 0 8px; scroll-snap-align: start; }
    .pontos { display: flex; justify-content: center; gap: 9px; min-height: 12px; margin-top: -8px; }
    .pontos button { width: 9px; height: 9px; padding: 0; border: none; border-radius: 50%; cursor: pointer;
                     background: rgba(255,255,255,.45); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
    .pontos button.ativo { background: #fff; transform: scale(1.25); }

    .movel { position: relative; }
    .movel.inteira { background-color: var(--m-moldura, #6b3f1a); padding: 0 10px; border-radius: 4px 4px 2px 2px;
                     background-image: var(--grao-v, none),
                       linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,0) 7%, rgba(0,0,0,0) 93%, rgba(0,0,0,.3));
                     box-shadow: 0 16px 20px -8px rgba(0,0,0,.6), 0 2px 5px rgba(0,0,0,.45); }
    .coroa, .rodape { display: none; }
    .movel.inteira .coroa { display: block; position: relative; z-index: 3; height: 18px; margin: 0 -16px;
                     border-radius: 4px 4px 0 0; background-color: var(--m-moldura, #6b3f1a);
                     background-image: var(--grao-h, none),
                       linear-gradient(to bottom, rgba(255,255,255,.3) 0, rgba(255,255,255,0) 4px, rgba(0,0,0,0) 11px, rgba(0,0,0,.42) 18px);
                     box-shadow: 0 4px 7px rgba(0,0,0,.5); }
    .movel.inteira .rodape { display: block; position: relative; z-index: 3; height: 22px; margin: 0 -14px;
                     border-radius: 0 0 3px 3px; background-color: var(--m-moldura, #6b3f1a);
                     background-image: var(--grao-h, none),
                       linear-gradient(to bottom, rgba(0,0,0,.5) 0, rgba(0,0,0,0) 6px, rgba(255,255,255,.14) 8px, rgba(0,0,0,.4) 22px); }

    /* Parte de dentro (o fundo da estante) */
    .corpo { position: relative; }
    .movel.inteira .corpo { background-color: var(--m-fundo, #b08752);
                     background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, rgba(255,255,255,.05) 1px 2px, rgba(0,0,0,0) 2px 52px),
                       var(--grao-v, none); }
    .movel.inteira .corpo::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
                     box-shadow: inset 14px 0 14px -10px rgba(0,0,0,.55), inset -14px 0 14px -10px rgba(0,0,0,.55),
                                 inset 0 14px 16px -10px rgba(0,0,0,.6); }
    /* Cada prateleira: uma fileira de peças (120px) e a tábua embaixo (10px) */
    .fileira { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 0 6px;
               background-image: linear-gradient(to bottom, rgba(0,0,0,.42), rgba(0,0,0,0) 20px); }
    .com-luz .fileira { height: 136px; }
    .tabua { height: 10px; background-color: var(--m-tabua, #7a4a21);
             background-image: linear-gradient(to bottom, rgba(255,255,255,.5) 0, rgba(255,255,255,.5) 1.5px, rgba(0,0,0,0) 1.5px, rgba(0,0,0,0) 6.5px, rgba(0,0,0,.5) 6.5px),
                               var(--grao-h, none); }
    .organizando .fileira { outline: 1px dashed rgba(255,255,255,.28); outline-offset: -3px; }

    .livro-estante { position: relative; flex-shrink: 0; height: 120px; display: flex; align-items: flex-end; cursor: pointer; transform-origin: 50% 100%; }
    .livro-estante svg, .livro-estante .deco-img { display: block; }
    .livro-estante svg { overflow: visible; }
    .capa-estante { height: 108px; width: 72px; object-fit: cover; border-radius: 1px 2px 2px 1px; box-shadow: 2px 2px 4px rgba(0,0,0,.5); }

    /* Lombada e livro deitado: a cor vem da capa; o tamanho vem do título (calculado no JavaScript) */
    .lombada, .deitado { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
                         color: #fff; border-radius: 2px; box-shadow: 2px 2px 4px rgba(0,0,0,.5); }
    .lombada { writing-mode: vertical-rl;
               background-image: linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,0) 24%, rgba(0,0,0,0) 68%, rgba(0,0,0,.3)); }
    .deitado { background-image: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 30%, rgba(0,0,0,0) 66%, rgba(0,0,0,.32)); }
    .lombada::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
                      box-shadow: inset 2px 0 3px rgba(255,255,255,.18), inset -3px 0 5px rgba(0,0,0,.3); }
    .deitado::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
                      box-shadow: inset 0 2px 3px rgba(255,255,255,.18), inset 0 -3px 5px rgba(0,0,0,.3); }
    .texto-lombada { position: relative; z-index: 2; font-weight: bold; line-height: 1.3; white-space: nowrap;
                     text-align: center; letter-spacing: .2px; text-shadow: 0 1px 2px rgba(0,0,0,.55); }
    .filete { position: absolute; z-index: 2; background: rgba(255,255,255,.42); }
    .lombada .filete { left: 0; right: 0; height: 2px; }
    .deitado .filete { top: 0; bottom: 0; width: 2px; }
    /* Plano B (quando não dá para ler a cor): a própria capa, desfocada */
    .com-capa::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.38); z-index: 1; }
    .fundo-capa { position: absolute; inset: 0; background-size: 100% 100%; background-position: center;
                  filter: blur(4px) saturate(1.15); transform: scale(1.25); }

    /* Luzes: um fio em cada prateleira; o fio e as lâmpadas são desenhos que se repetem */
    .luz { position: absolute; left: 0; right: 0; top: 0; height: 26px; z-index: 2; pointer-events: none;
           background-image: var(--fio); background-repeat: repeat-x; background-size: 64px 26px; }
    .luz::before, .luz::after { content: ""; position: absolute; inset: 0; background-repeat: repeat-x; background-size: 64px 26px;
                                animation: pisca 1.9s ease-in-out infinite; }
    .luz::before { background-image: var(--luz-a); }
    .luz::after { background-image: var(--luz-b); animation-delay: -.95s; }
    @keyframes pisca { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

    /* Modo Organizar (arrastar) */
    .organizando .livro-estante[data-chave] { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
                                              animation: tremer .34s ease-in-out infinite alternate; }
    .organizando .livro-estante[data-chave]:nth-child(2n) { animation-direction: alternate-reverse; animation-duration: .4s; }
    @keyframes tremer { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }
    .organizando img { -webkit-user-drag: none; }
    .livro-estante.fantasma { opacity: .22; animation: none !important; }
    .peca-voando { position: fixed; z-index: 70; pointer-events: none; cursor: grabbing; animation: none !important;
                   transform: scale(1.12) rotate(-3deg); filter: drop-shadow(0 10px 8px rgba(0,0,0,.55)); }
    body.arrastando { user-select: none; -webkit-user-select: none; }
    @media (prefers-reduced-motion: reduce) {
      .luz::before, .luz::after, .organizando .livro-estante[data-chave], .chama, .vapor { animation: none !important; }
    }

    /* Botão + (enfeites): fica flutuando no canto da estante */
    .botao-mais { position: fixed; bottom: 92px; right: max(16px, calc(50vw - 224px)); z-index: 15; width: 48px; height: 48px;
                  border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,.94); color: #4a3a2a;
                  box-shadow: 0 3px 8px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
    .botao-mais .icone { width: 24px; height: 24px; stroke-width: 2.4; }

    /* Perfil */
    .perfil { padding: 16px; }
    .perfil label, .perfil .rotulo { display: block; margin: 0 0 6px; font-size: 13px; color: var(--suave); }
    .perfil input, .perfil textarea, .perfil select { width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 6px; background: var(--campo); }
    .perfil textarea { min-height: 70px; resize: vertical; line-height: 1.45; font-style: italic; }
    .perfil .bloco { margin-bottom: 22px; }
    .cabeca-perfil { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 4px 0 24px; }
    .foto { width: 112px; height: 112px; border-radius: 50%; border: 3px solid var(--borda); background: var(--campo) center / cover no-repeat;
            display: flex; align-items: center; justify-content: center; color: var(--suave2); cursor: pointer; padding: 0; }
    .foto .icone { width: 44px; height: 44px; }
    .foto.com-foto .icone { display: none; }
    .nome-perfil { margin: 0; font-size: 20px; }
    .frase-perfil { margin: 0 16px; text-align: center; font-style: italic; color: var(--suave); font-size: 14px; }
    .favorito { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    .favorito img, .favorito .sem-capa-mini { width: 54px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; flex-shrink: 0; cursor: default; }
    .favorito h4 { margin: 0 0 2px; font-size: 15px; }
    .favorito p { margin: 0; font-size: 13px; color: var(--suave); }
    .linha-meta { display: flex; align-items: center; gap: 10px; }
    .linha-meta input { width: 90px; }
    .resumo { margin-top: 8px; font-size: 15px; }
    .resumo p { margin: 8px 0; }

    /* Resumo (dashboards) */
    .painel-dados { padding: 16px; }
    .topo-dados { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .topo-dados h2 { margin: 0; font-size: 18px; }
    .topo-dados select { padding: 8px; border-radius: 6px; border: 1px solid var(--borda); background: var(--campo); }
    .cartao { background: var(--card); border: 1px solid var(--linha); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .cartao h3 { margin: 0 0 10px; font-size: 15px; }
    .cartao .sub { margin: -6px 0 12px; font-size: 12px; color: var(--suave2); }
    .meta-numeros { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
    .meta-numeros strong { font-size: 40px; line-height: 1; }
    .meta-numeros span { color: var(--suave); font-size: 15px; }
    .barra-meta { height: 12px; border-radius: 6px; background: var(--linha); overflow: hidden; }
    .barra-meta div { height: 100%; border-radius: 6px; background: var(--destaque); transition: width .5s; }
    .meta-texto { margin: 8px 0 0; font-size: 13px; color: var(--suave); }
    .blocos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bloco-num { background: var(--card); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; }
    .bloco-num strong { display: block; font-size: 26px; line-height: 1.1; }
    .bloco-num span { font-size: 12px; color: var(--suave); }
    .meses { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 150px; padding-top: 16px;
             border-bottom: 1px solid var(--borda); }
    .mes { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; }
    .mes .coluna { width: 100%; max-width: 20px; border-radius: 4px 4px 0 0; background: var(--destaque); min-height: 0; }
    .mes .valor { font-size: 11px; color: var(--suave); margin-bottom: 3px; }
    .mes.atual .coluna { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--destaque); }
    .rotulos-meses { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 5px; font-size: 10px; color: var(--suave2); text-align: center; }
    .barras-h { display: flex; flex-direction: column; gap: 8px; }
    .barra-h { display: grid; grid-template-columns: 96px 1fr 26px; align-items: center; gap: 8px; font-size: 13px; }
    .barra-h .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta); }
    .barra-h .nome.estrelas-txt { color: var(--estrela); letter-spacing: 1px; }
    .barra-h .trilho { height: 12px; border-radius: 0 4px 4px 0; }
    .barra-h .trilho div { height: 100%; border-radius: 0 4px 4px 0; background: var(--destaque); min-width: 2px; }
    .barra-h .num { text-align: right; color: var(--suave); }
    .vazio-dados { font-size: 13px; font-style: italic; color: var(--suave2); margin: 0; }
    .tabela-dados { margin-top: 10px; font-size: 12px; color: var(--suave); }
    .tabela-dados summary { cursor: pointer; }
    .tabela-dados table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .tabela-dados td { padding: 3px 0; border-bottom: 1px solid var(--linha); }
    .tabela-dados td:last-child { text-align: right; }
    .dica-dados { position: fixed; z-index: 60; pointer-events: none; background: var(--tinta); color: var(--papel); font-size: 12px;
                  padding: 6px 9px; border-radius: 6px; transform: translate(-50%, -100%); white-space: nowrap; }

    /* Menu de baixo */
    .menu { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
            display: flex; background: var(--barra); border-top: 1px solid var(--linha); z-index: 20; }
    .menu button { flex: 1; background: none; border: none; color: var(--icone); padding: 8px 0 8px;
                   font-size: 12px; cursor: pointer; }
    .menu button .icone { display: block; margin: 0 auto 2px; }
    .menu button.ativo { color: var(--icone-ativo); font-weight: bold; }

    /* Folha (sobe de baixo): personalizar, decorar... */
    .fundo-folha { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; }
    .folha { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
             max-height: 85vh; overflow-y: auto; background: var(--papel); border-radius: 16px 16px 0 0;
             padding: 16px; z-index: 40; animation: subir .25s ease; }
    @keyframes subir { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .titulo-folha { margin: 0 0 4px; font-size: 18px; }
    .dica { margin: 0 0 12px; font-size: 13px; color: var(--suave); }
    .rotulo { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--suave2); }
    .grupo { display: flex; gap: 6px; }
    .grupo button { flex: 1; padding: 10px 4px; border: 1px solid var(--borda); background: var(--campo); color: var(--tinta);
                    border-radius: 6px; cursor: pointer; font-size: 13px; }
    .grupo button.ativo { background: var(--destaque); border-color: var(--destaque); color: #fff; }
    input[type=date] { width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 6px; background: var(--campo); }
    .perigo { margin-top: 18px; width: 100%; padding: 10px; background: none; border: 1px solid var(--perigo); color: var(--perigo); border-radius: 6px; cursor: pointer; }
    .fechar { margin-top: 8px; width: 100%; padding: 10px; background: none; border: none; color: var(--suave); cursor: pointer; }

    /* Personalizar a estante */
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { width: 64px; text-align: center; font-size: 11px; color: var(--suave); cursor: pointer; background: none; border: none; padding: 0; }
    .chip .amostra-modelo { display: block; width: 64px; height: 48px; border-radius: 6px; border: 6px solid; margin-bottom: 4px; }
    .chip .tile-papel { display: flex; align-items: center; justify-content: center; width: 64px; height: 56px;
                        border-radius: 6px; margin-bottom: 4px; box-shadow: 0 0 0 1px var(--borda); font-size: 24px; color: var(--suave); }
    .chip.ativo .amostra-modelo, .chip.ativo .tile-papel { box-shadow: 0 0 0 3px var(--destaque); }
    .chip.ativo { color: var(--tinta); font-weight: bold; }
    .linha-cor { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .linha-cor input[type=color] { width: 40px; height: 32px; padding: 0; border: 1px solid var(--borda);
                                   border-radius: 6px; background: none; cursor: pointer; }
    #amostras { display: flex; gap: 6px; }
    .amostra { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid #fff;
               box-shadow: 0 0 0 1px #b8a584; cursor: pointer; }
    .links { display: flex; gap: 16px; margin-top: 10px; }
    .link { background: none; border: none; padding: 0; color: var(--destaque); font-size: 13px; text-decoration: underline; cursor: pointer; }

    /* Decorar a estante */
    .opcoes-deco { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .opcao-deco { background: var(--campo); border: 1px solid var(--borda); border-radius: 10px; padding: 10px 2px 8px;
                  cursor: pointer; color: var(--tinta); font-size: 12px; display: flex; flex-direction: column;
                  align-items: center; gap: 6px; }
    .opcao-deco .fig { height: 56px; display: flex; align-items: flex-end; }
    .opcao-deco svg { height: 56px; width: auto; }

    /* Aviso rapidinho */
    .aviso { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--tinta);
             color: var(--papel); padding: 10px 16px; border-radius: 20px; font-size: 13px; opacity: 0;
             pointer-events: none; transition: opacity .25s; z-index: 50; }
    .aviso.visivel { opacity: 1; }

    /* ===== Ajustes novos (ficam depois dos antigos para valer por cima) ===== */
    .botoes-estante { display: flex; gap: 6px; }
    .botao-personalizar.ativo-org { background: #b3541e; }
    .faixa-organizar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px;
                       padding: 8px 10px; border-radius: 8px; background: var(--campo); font-size: 12px; color: var(--suave); }
    .faixa-organizar .link { flex-shrink: 0; }
    .grupo.quebra { flex-wrap: wrap; }
    .grupo.quebra button { flex: 1 0 28%; }
    .chip .amostra-modelo { background-size: 110px 110px; }
    .opcao-deco .fig { height: 68px; align-items: flex-end; justify-content: center; }
    .opcao-deco svg, .opcao-deco img { height: 68px; width: auto; max-width: 100%; }
    .opcao-deco .mais-deco { width: 44px; height: 44px; margin-bottom: 8px; border-radius: 50%; border: 2px dashed var(--borda);
                             display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--suave); }
    /* Chama da vela e vapor da xícara */
    .chama { transform-box: fill-box; transform-origin: 50% 100%; animation: chama .8s ease-in-out infinite alternate; }
    @keyframes chama { from { transform: scale(1, 1) skewX(-2deg); } to { transform: scale(.92, 1.08) skewX(3deg); } }
    .vapor { animation: vapor 3.2s ease-in-out infinite; }
    @keyframes vapor { 0%, 100% { opacity: .15; transform: translateY(1px); } 50% { opacity: .6; transform: translateY(-2px); } }
  </style>
</head>

<script>
  // ====== CONFIGURAÇÕES (mexa aqui) ======
  const NOMES = { lendo: "Lendo agora", quero: "Próximas leituras", lido: "Lidos" };
  const ICONES = { lendo: "📖", quero: "🔖", lido: "✅" };
  const TITULOS_ABAS = { inicio: "Início", estante: "Minha estante", resumo: "Meu resumo", perfil: "Perfil" };
  const MAX_NO_INICIO = 4;   // quantas capas aparecem no Início antes da seta
  const CORES_PAREDE = ["#2f5d4e", "#27425e", "#6b2d3c", "#8c7b66", "#2b2623", "#c9b79c"];

  // Modelos de madeira (moldura = madeira de fora, fundo = parte de dentro, tabua = prateleira, grao = força da textura)
  const MODELOS = {
    classica: { nome: "Clássica", moldura: "#7a3f1d", fundo: "#a6683a", tabua: "#8a4f26", grao: 0.5,  graoCor: [0.16, 0.06, 0.02] },
    nogueira: { nome: "Nogueira", moldura: "#3d2516", fundo: "#583826", tabua: "#47291a", grao: 0.55, graoCor: [0.04, 0.02, 0.01] },
    carvalho: { nome: "Carvalho", moldura: "#c8a06a", fundo: "#e3caa0", tabua: "#c9a068", grao: 0.4,  graoCor: [0.35, 0.2, 0.08] },
    rustica:  { nome: "Rústica",  moldura: "#8a8274", fundo: "#a8a090", tabua: "#948c7c", grao: 0.5,  graoCor: [0.2, 0.18, 0.14] },
    branca:   { nome: "Branca",   moldura: "#f3efe8", fundo: "#e6e0d4", tabua: "#faf7f2", grao: 0.07, graoCor: [0.3, 0.28, 0.25] },
    preta:    { nome: "Preta",    moldura: "#212124", fundo: "#2e2e32", tabua: "#18181a", grao: 0.12, graoCor: [1, 1, 1] }
  };

  // Textura de veios de madeira (ruído esticado): "h" = veios deitados, "v" = veios em pé
  function graoSvg(direcao, m) {
    const freq = direcao === "h" ? "0.012 0.5" : "0.5 0.012";
    const k = (m.grao * 3.2).toFixed(2), b = (-m.grao * 1.2).toFixed(2);
    const [r, g, bl] = m.graoCor;
    return ladrilho(`<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>
      <filter id='f' x='0' y='0' width='100%' height='100%'>
        <feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='3' seed='7' stitchTiles='stitch'/>
        <feColorMatrix values='0 0 0 0 ${r}  0 0 0 0 ${g}  0 0 0 0 ${bl}  ${k} 0 0 0 ${b}'/>
      </filter><rect width='100%' height='100%' filter='url(#f)'/></svg>`);
  }

  // Fio e lâmpadas das luzes (3 desenhos: o fio, as lâmpadas A e as lâmpadas B, que piscam alternadas)
  const LUZES = {
    nenhuma:   { nome: "Sem luzes" },
    quentes:   { nome: "Quentes",   forma: "bulbo",    cores: ["#ffd27a", "#ffc25c"] },
    brancas:   { nome: "Brancas",   forma: "bulbo",    cores: ["#f4fbff", "#dcefff"] },
    coloridas: { nome: "Coloridas", forma: "bulbo",    cores: ["#ff5e6c", "#ffd45e", "#5ee08a", "#5eb6ff", "#c08bff", "#ff9a5e"] },
    estrelas:  { nome: "Estrelas",  forma: "estrela",  cores: ["#ffe08a", "#fff3c4"] },
    coracoes:  { nome: "Corações",  forma: "coracao",  cores: ["#ff7fa0", "#ffb0c4"] },
    bolas:     { nome: "Bolas",     forma: "bola",     cores: ["#ffd9e0", "#fff1c9", "#d9f0ff", "#e3d9ff"] },
    lanternas: { nome: "Lanternas", forma: "lanterna", cores: ["#ff8a5c", "#ffc85c", "#ff6f7d", "#ffe08a"] }
  };

  function desenhosLuzes(tipo) {
    const L = LUZES[tipo] || LUZES.quentes;
    const pontos = L.forma === "bulbo"
      ? [[8, 10.1], [16, 12.5], [24, 10.1], [40, 10.1], [48, 12.5], [56, 10.1]]
      : [[8, 10.1], [24, 10.1], [40, 10.1], [56, 10.1]];
    const moldura = (miolo) => ladrilho(`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='26'>${miolo}</svg>`);
    const n = (v) => v.toFixed(1);

    const forma = (x, y, cor) => {
      const cy = y + (L.forma === "bulbo" ? 3.6 : 5);
      const brilho = `<circle cx='${x}' cy='${n(cy)}' r='7' fill='${cor}' fill-opacity='.22'/>`;
      if (L.forma === "estrela") {
        const p = Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 2 : 4.6, a = i * Math.PI / 5;
          return n(x + r * Math.sin(a)) + " " + n(cy - r * Math.cos(a)); }).join("L");
        return brilho + `<path d='M${p}Z' fill='${cor}'/>`;
      }
      if (L.forma === "coracao") {
        return brilho + `<path d='M${x} ${n(cy + 3.8)}C${x - 6} ${n(cy - 0.4)} ${x - 2.6} ${n(cy - 4.6)} ${x} ${n(cy - 1.6)}C${x + 2.6} ${n(cy - 4.6)} ${x + 6} ${n(cy - 0.4)} ${x} ${n(cy + 3.8)}Z' fill='${cor}'/>`;
      }
      if (L.forma === "bola") {
        return brilho + `<circle cx='${x}' cy='${n(cy)}' r='4.4' fill='${cor}'/><circle cx='${x - 1.4}' cy='${n(cy - 1.4)}' r='1.3' fill='#fff' fill-opacity='.8'/>`;
      }
      if (L.forma === "lanterna") {
        return brilho + `<rect x='${x - 3}' y='${n(cy - 3.6)}' width='6' height='7.6' rx='2.4' fill='${cor}'/>`
          + `<rect x='${x - 2}' y='${n(cy - 4.4)}' width='4' height='1.2' fill='#3a2a1a'/><rect x='${x - 2}' y='${n(cy + 3.6)}' width='4' height='1.2' fill='#3a2a1a'/>`
          + `<path d='M${x} ${n(cy - 3.2)}V${n(cy + 3.6)}' stroke='#fff' stroke-opacity='.45' stroke-width='.8'/>`;
      }
      return brilho + `<circle cx='${x}' cy='${n(cy)}' r='4.4' fill='${cor}' fill-opacity='.35'/><circle cx='${x}' cy='${n(cy)}' r='2.5' fill='${cor}'/>`
        + `<circle cx='${x - 0.7}' cy='${n(cy - 0.8)}' r='.8' fill='#fff' fill-opacity='.85'/>`;
    };

    const fio = moldura(
      `<path d='M0 3Q16 22 32 3Q48 22 64 3' fill='none' stroke='#1d1710' stroke-opacity='.85' stroke-width='1.1'/>`
      + pontos.map(([x, y]) => `<rect x='${x - 1}' y='${y - 0.6}' width='2' height='2.4' rx='.5' fill='#1d1710'/>`).join(""));

  // Atalho: $("abc") é o mesmo que document.getElementById("abc")

  // Guarda no navegador sem quebrar se o espaço acabar

  minhaLista.forEach(l => { if (l.status === "lido" && !l.dataLido) l.dataLido = hoje(); });

  // Personalização da estante
  let corParedeAtual = localStorage.getItem("corParede") || CORES_PAREDE[0];

    localStorage.setItem("meusLivros", JSON.stringify(minhaLista));

  function hoje() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // "2026-11-14" vira "14/11/2026"
  function formatarData(iso) {
    const p = iso.split("-");
    return p[2] + "/" + p[1] + "/" + p[0];
  }

  function dadosDoLivro(livro) {
    const info = livro.volumeInfo;
    const miniatura = info.imageLinks ? info.imageLinks.thumbnail : "";
    return {
      id: livro.id,
      titulo: info.title || "Sem título",
      autor: info.authors ? info.authors.join(", ") : "Autor desconhecido",
      capa: miniatura ? miniatura.replace("http://", "https://") : ""

  }

  // Muda o status de um livro (e anota a data quando vira "lido")
  function definirStatus(livro, status) {
    livro.status = status;

  }

  // ====== COR DA CAPA (para a lombada e o livro deitado) ======
  function rgbParaHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    const l = (mx + mn) / 2;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    let h = 0;
    if (d !== 0) {
      if (mx === r) h = ((g - b) / d + 6) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
    }
    return [h * 60, s, l];
  }

  // Olha os pixels da capa e acha a cor que mais aparece (ignorando branco e preto)
  function corDominante(img) {
    const L = 24, A = 36;
    const tela = document.createElement("canvas");
    tela.width = L; tela.height = A;
    const g = tela.getContext("2d");
    g.drawImage(img, 0, 0, L, A);
    const px = g.getImageData(0, 0, L, A).data;

    const baldes = Array.from({ length: 12 }, () => ({ peso: 0, r: 0, g: 0, b: 0 }));
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] < 128) continue;
      const [h, s, l] = rgbParaHsl(px[i], px[i + 1], px[i + 2]);
      if (l > 0.92 || l < 0.08) continue;
      const peso = 0.05 + s * s;                 // cores vivas valem mais
      const b = baldes[Math.floor(h / 30) % 12];
      b.peso += peso; b.r += px[i] * peso; b.g += px[i + 1] * peso; b.b += px[i + 2] * peso;
    }
    const melhor = baldes.reduce((a, b) => (b.peso > a.peso ? b : a));
    if (melhor.peso === 0) return null;

    let [h, s, l] = rgbParaHsl(melhor.r / melhor.peso, melhor.g / melhor.peso, melhor.b / melhor.peso);
    s = Math.min(s, 0.8);
    l = Math.min(Math.max(l, 0.2), 0.42);        // escuro o bastante para o texto branco ler bem
    return "hsl(" + Math.round(h) + ", " + Math.round(s * 100) + "%, " + Math.round(l * 100) + "%)";
  }

  function extrairCor(livro) {
    if (!livro.capa || livro.corCapa || corEmAndamento.has(livro.id) || corFalhou.has(livro.id)) return;
    corEmAndamento.add(livro.id);

    const terminar = (cor) => {
      corEmAndamento.delete(livro.id);
      if (cor) { livro.corCapa = cor; salvarLista(); } else { corFalhou.add(livro.id); }
      desenharEstante();
    };

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      let cor = null;
      try { cor = corDominante(img); } catch (e) {}
      terminar(cor);
    };
    img.onerror = () => terminar(null);
    // um parâmetro a mais no endereço evita usar a versão guardada sem permissão de leitura
    img.src = /^https?:/.test(livro.capa) ? livro.capa + (livro.capa.includes("?") ? "&" : "?") + "cor=1" : livro.capa;
  }

  // ====== TEMA CLARO / ESCURO ======
  let temaEscolhido = localStorage.getItem("tema") || "auto";
  const modoEscuroDoCelular = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function aplicarTema() {
    const escuro = temaEscolhido === "escuro" || (temaEscolhido === "auto" && modoEscuroDoCelular && modoEscuroDoCelular.matches);
    document.documentElement.setAttribute("data-tema", escuro ? "escuro" : "claro");
    document.querySelectorAll("#botoesTema button").forEach(b => b.classList.toggle("ativo", b.dataset.tema === temaEscolhido));
  }

  function escolherTema(tema) {
    temaEscolhido = tema;
    localStorage.setItem("tema", tema);
    aplicarTema();
  }

  // No modo "Automático", acompanha quando o celular troca de dia para noite
  if (modoEscuroDoCelular && modoEscuroDoCelular.addEventListener) {
    modoEscuroDoCelular.addEventListener("change", aplicarTema);
  }

  // ====== ABAS E PÁGINAS ======
  function mostrarAba(nome) {
    abaAtual = nome;
    if (nome !== "livro") livroAberto = null;
    if (modoOrganizar && nome !== "estante" && nome !== "livro") { modoOrganizar = false; desenharEstante(); }

    let noMenu = nome;                                          // qual ícone do menu fica aceso
    if (nome === "lista") noMenu = "inicio";
    if (nome === "livro") noMenu = (abaDoLivro === "lista") ? "inicio" : abaDoLivro;

    document.querySelectorAll(".aba").forEach(a => a.classList.toggle("ativa", a.id === "aba-" + nome));
    document.querySelectorAll(".menu button").forEach(b => b.classList.toggle("ativo", b.dataset.aba === noMenu));
    $("botaoVoltar").hidden = !(nome === "lista" || nome === "livro");
    $("tituloTopo").textContent = nome === "lista" ? NOMES[categoriaAberta]
                                : nome === "livro" ? "Livro"
                                : TITULOS_ABAS[nome];
    window.scrollTo(0, 0);
  }

  function voltar() {
    if (abaAtual === "livro") mostrarAba(abaDoLivro);
    else mostrarAba("inicio");
  }

  function abrirCategoria(status) {
    categoriaAberta = status;
    desenharLista();
    mostrarAba("lista");
  }

  // Abre a página de um livro (é chamada ao tocar em qualquer capa)
  function abrirDetalhes(id) {
    if (abaAtual !== "livro") abaDoLivro = abaAtual;

    desenharLivro();
    mostrarAba("livro");
  }
